spring:
  application:
    name: library-pks
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library_backend}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  auth:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:library-pks}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    login: ${BOOTSTRAP_ADMIN_LOGIN:}
    name: ${BOOTSTRAP_ADMIN_NAME:Администратор}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
